name: an_nhien
description: "An Nhiên – lịch sinh hoạt Power 9 cho người 65+ (PRM393 Lab 3)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  clock: ^1.1.2
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_ai: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  firebase_remote_config: ^7.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.2
  go_router: ^18.1.2
  google_sign_in: ^7.2.0
  pdf: ^3.13.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Be Vietnam Pro (Google Fonts, OFL) – bundle sẵn, không tải qua mạng. F0 – Sanh.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
    - family: NotoSerifDisplay
      fonts:
        - asset: assets/fonts/NotoSerifDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifDisplay-Bold.ttf
          weight: 700
  assets:
    - assets/caregiver/
    # Ảnh thói quen (CC0, nguồn ở docs/image-credits.md).
    - assets/images/habits/
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/NotoSerifDisplay-LICENSE.txt
  # TODO(A – Sanh, F0): thêm font Be Vietnam Pro vào assets/fonts/ rồi mở khối dưới.
  # fonts:
