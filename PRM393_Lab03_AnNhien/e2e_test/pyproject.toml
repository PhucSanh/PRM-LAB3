[project]
name = "an-nhien-e2e"
version = "0.1.0"
requires-python = ">=3.12"
# ARTEMIS Python SDK, ghim commit để ca E2E có thể chạy lại đúng cùng API.
dependencies = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "artemis-client @ git+https://github.com/google/artemis.git@351ca8422f7b5b54e80a9c1ce03a222e02415b6b#subdirectory=packages/artemis-client",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
